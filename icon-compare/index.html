<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>381 → R 圖示對照</title>
<style>
:root {
    --bg: #f4f2ee;
    --panel: #ffffff;
    --ink: #22201c;
    --muted: #6d675e;
    --line: #dcd6cc;
    --accent: #8a5a1c;
    --accent-ink: #ffffff;
    --slot: #2a2722;
    --slot-line: #4a443b;
    --empty: #e8e3da;
    --tag-both: #2f7a4b;
    --tag-r: #2f5f9a;
    --tag-381: #9a5a2f;
    --rail: #7a1f1f;
    --rail-ink: #f7ecec;
    --rail-muted: #e3b8b8;
    --rail-active: #c43c3c;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #181715;
        --panel: #22201d;
        --ink: #ece7de;
        --muted: #a39c90;
        --line: #3a3631;
        --accent: #d39b4f;
        --accent-ink: #1b1813;
        --slot: #121110;
        --slot-line: #3d3830;
        --empty: #2b2925;
        --tag-both: #5fbf83;
        --tag-r: #6f9fe0;
        --tag-381: #e0995f;
        --rail: #4a1414;
        --rail-ink: #f6e8e8;
        --rail-muted: #c99494;
        --rail-active: #b33333;
    }
}
:root[data-theme="dark"] {
    --bg: #181715;
    --panel: #22201d;
    --ink: #ece7de;
    --muted: #a39c90;
    --line: #3a3631;
    --accent: #d39b4f;
    --accent-ink: #1b1813;
    --slot: #121110;
    --slot-line: #3d3830;
    --empty: #2b2925;
    --tag-both: #5fbf83;
    --tag-r: #6f9fe0;
    --tag-381: #e0995f;
    --rail: #4a1414;
    --rail-ink: #f6e8e8;
    --rail-muted: #c99494;
    --rail-active: #b33333;
}
* {
    box-sizing: border-box;
}
[hidden] {
    display: none !important;
}
html, body {
    height: 100%;
}
body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    display: flex;
    flex-direction: row;
    min-height: 100vh;
}
.page {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin-right: 52px;
}
header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px 10px;
}
.bar {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
}
h1 {
    font-size: 17px;
    margin: 0 8px 0 0;
    white-space: nowrap;
}
.tabs, .filters, .subtabs {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
}
.top-pager {
    display: flex;
    gap: 6px;
    align-items: center;
    white-space: nowrap;
}
button {
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
}
button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
}
button:disabled {
    opacity: .4;
    cursor: default;
}
input[type="search"] {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 10px;
    width: 240px;
    max-width: 100%;
}
.count {
    font-size: 12px;
    opacity: .85;
    margin-left: 2px;
}
main {
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
    padding: 14px 16px 40px;
    flex: 1;
}
.summary {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 10px;
}
.asset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
}
.asset-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    min-width: 0;
}
.asset-card img {
    display: block;
    width: 100%;
    max-height: 140px;
    object-fit: contain;
    background: var(--slot);
    border-radius: 4px;
}
.asset-card .name {
    white-space: normal;
    word-break: break-all;
}
.map-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
}
.map-card img,
.map-card .map-missing {
    display: block;
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: var(--slot);
    border-radius: 4px;
}
.map-card .map-missing {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
}
.map-card {
    cursor: pointer;
}
.map-card .meta {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.map-view[hidden] {
    display: none !important;
}
.map-view {
    position: fixed;
    z-index: 20;
    top: 0;
    left: 0;
    right: 52px;
    bottom: 0;
    background: rgba(12, 11, 10, .88);
    display: flex;
    flex-direction: column;
}
.map-view-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
}
.map-view-title {
    flex: 1;
    min-width: 180px;
}
.map-view-title .name {
    white-space: normal;
}
.map-view-stage {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    position: relative;
}
.map-view-stage.is-drag {
    cursor: grabbing;
}
.map-view-stage img {
    position: absolute;
    left: 50%;
    top: 50%;
    max-width: 92%;
    max-height: 92%;
    transform-origin: center center;
    user-select: none;
    -webkit-user-drag: none;
}
.empty-state {
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--muted);
    padding: 36px 18px;
    text-align: center;
    font-size: 15px;
    line-height: 1.7;
}
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 10px;
}
.row {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 8px 8px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr);
    align-items: start;
    position: relative;
}
.row .tag {
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 11px;
    font-weight: bold;
}
.tag.both {
    color: var(--tag-both);
}
.tag.r {
    color: var(--tag-r);
}
.tag.v381 {
    color: var(--tag-381);
}
.side {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-width: 0;
}
.slot {
    width: 54px;
    height: 54px;
    border-radius: 6px;
    background: var(--slot);
    border: 1px solid var(--slot-line);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.slot img {
    image-rendering: auto;
    max-width: 50px;
    max-height: 50px;
}
.slot img.icon-381 {
    width: 31px;
    height: 31px;
    object-fit: contain;
}
.slot.empty {
    background: var(--empty);
    border: 1px dashed var(--line);
}
.slot.noimg {
    color: #8c857a;
    font-size: 11px;
}
.name {
    margin-top: 5px;
    font-size: 13px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.meta {
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
}
.row .eid .diffuse {
    color: var(--tag-381);
    font-weight: bold;
}
.row .eid {
    grid-column: 1 / -1;
    font-size: 11px;
    color: var(--muted);
    margin: -4px 0 4px 2px;
    padding-right: 64px;
}
.arrow {
    align-self: center;
    margin-top: -18px;
    text-align: center;
    color: var(--muted);
    font-size: 18px;
}
.top-pager input {
    width: 64px;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 6px;
}
.legend {
    font-size: 12px;
    color: var(--muted);
    margin-top: 18px;
    line-height: 1.7;
}
select {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
}
.cls-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.cls-head {
    font-weight: bold;
    margin: 14px 0 2px;
    font-size: 15px;
}
.cls-row {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    display: grid;
    grid-template-columns: minmax(220px, 300px) 1fr;
    gap: 12px;
}
.cls-left .icons {
    display: flex;
    gap: 10px;
}
.cls-left .icons .lbl {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
}
.cls-left .title {
    font-size: 15px;
    font-weight: bold;
    margin-top: 6px;
}
.cls-left .desc {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
}
.cand-group {
    margin-bottom: 8px;
}
.cand-group .gt {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
}
.cands {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
.cand {
    width: 128px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}
.cand.sel {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent) inset;
}
.cand .name {
    font-size: 12px;
}
.cand .how {
    font-size: 11px;
    color: var(--accent);
    word-break: break-all;
}
.cand button {
    margin-top: 4px;
    font-size: 12px;
    padding: 2px 8px;
}
.none {
    font-size: 12px;
    color: var(--muted);
    padding: 6px 0;
}
.manual {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
}
.manual input {
    width: 70px;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 4px;
}
#exportOut {
    width: 100%;
    min-height: 120px;
    font: 12px/1.4 Consolas, monospace;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-top: 10px;
}
.rail {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 6;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    width: 52px;
    height: 100vh;
    height: 100dvh;
    background: var(--rail);
    border-left: 1px solid #5a1515;
}
.rail button {
    flex: 1;
    width: 100%;
    margin: 0;
    padding: 10px 0;
    border: 0;
    border-radius: 0;
    border-bottom: 1px solid rgba(255, 255, 255, .12);
    background: transparent;
    color: var(--rail-muted);
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: .18em;
    font-weight: bold;
}
.rail button:last-child {
    border-bottom: 0;
}
.rail button[aria-pressed="true"] {
    background: var(--rail-active);
    border-color: transparent;
    color: var(--rail-ink);
}
@media (max-width: 720px) {
    .cls-row {
        grid-template-columns: 1fr;
    }
    .page {
        margin-right: 40px;
    }
    .rail {
        width: 40px;
    }
    .map-view {
        right: 40px;
    }
}
@media (max-width: 520px) {
    .grid {
        grid-template-columns: minmax(0, 1fr);
    }
    .top-pager {
        flex-wrap: wrap;
        white-space: normal;
    }
    input[type="search"] {
        width: 100%;
    }
}
</style>
</head>
<body>
<div class="page">
<header>
    <div class="bar">
        <h1>381 → R 圖示對照</h1>
        <div class="subtabs" id="skillViews" hidden>
            <button data-view="skills" aria-pressed="true">技能對照</button>
            <button data-view="classSkills" aria-pressed="false">轉職技能</button>
            <button data-view="status" aria-pressed="false">狀態圖示</button>
        </div>
        <a href="shape-compare.html" style="align-self:center;color:var(--accent);white-space:nowrap">形狀比對 →</a>
        <input type="search" id="q" placeholder="搜尋圖片編號" aria-label="搜尋圖片編號">
        <select id="clsSel" aria-label="職業" hidden>
            <option value="">全部職業</option>
        </select>
        <select id="assetSel" aria-label="資料夾" hidden>
            <option value="">全部資料夾</option>
        </select>
        <div class="filters" id="pickBar" hidden>
            <button id="exportBtn">匯出選擇</button>
            <button id="clearBtn">清除選擇</button>
            <span class="count" id="pickCount"></span>
        </div>
        <div class="filters" id="filters">
            <button data-f="all" aria-pressed="true">全部<span class="count"></span></button>
            <button data-f="both" aria-pressed="false">兩邊有圖<span class="count"></span></button>
            <button data-f="r" aria-pressed="false">只有 R 圖<span class="count"></span></button>
            <button data-f="381" aria-pressed="false">只有 381 圖<span class="count"></span></button>
            <button data-f="missing" aria-pressed="false">兩邊缺圖<span class="count"></span></button>
            <button data-f="diff" aria-pressed="false" hidden>用途不同<span class="count"></span></button>
        </div>
        <button id="theme" title="切換深淺色">深／淺</button>
        <nav class="top-pager" id="topPager" aria-label="上方換頁">
            <button data-p="first">第一頁</button>
            <button data-p="prev">上一頁</button>
            <span>第 <input type="number" min="1" value="1" id="pgin" aria-label="頁碼"> / <span id="topPages"></span> 頁</span>
            <button data-p="next">下一頁</button>
            <button data-p="last">最後一頁</button>
        </nav>
    </div>
</header>
<main>
    <div class="summary" id="summary"></div>
    <div class="grid" id="grid"></div>
    <div class="legend" id="legend"></div>
</main>
</div>
<nav class="rail" id="rail" aria-label="分類">
    <button type="button" data-tab="map" aria-pressed="false">地圖</button>
    <button type="button" data-tab="skills" aria-pressed="false">技能</button>
    <button type="button" data-tab="items" aria-pressed="true">道具</button>
    <button type="button" data-tab="ui" aria-pressed="false">介面</button>
    <button type="button" data-tab="portraits" aria-pressed="false">人物立繪</button>
</nav>
<div id="mapView" class="map-view" hidden>
    <div class="map-view-bar">
        <div class="map-view-title" id="mapViewTitle"></div>
        <button type="button" data-zoom="in">放大</button>
        <button type="button" data-zoom="out">縮小</button>
        <button type="button" data-zoom="reset">整張</button>
        <button type="button" id="mapViewClose">關閉</button>
    </div>
    <div class="map-view-stage" id="mapViewStage">
        <img id="mapViewImg" alt="">
    </div>
</div>
<script src="data.js"></script>
<script>
(function () {
    var DATA = window.ICON_DATA;
    var PAGE = 120;
    var MAIN_TABS = ['map', 'skills', 'items', 'ui', 'portraits'];
    var SKILL_VIEWS = ['skills', 'classSkills', 'status'];
    var EMPTY_TABS = {};
    var LEGACY_TABS = { classSkills: 1, status: 1 };
    var state = { tab: 'items', view: 'skills', f: 'all', q: '', page: 0 };
    try {
        var saved = JSON.parse(localStorage.getItem('iconCompareState') || '{}');
        if (LEGACY_TABS[saved.tab]) {
            state.tab = 'skills';
            state.view = saved.tab;
        } else if (MAIN_TABS.indexOf(saved.tab) >= 0) {
            state.tab = saved.tab;
        }
        if (SKILL_VIEWS.indexOf(saved.view) >= 0) {
            state.view = saved.view;
        }
        if (saved.theme) {
            document.documentElement.setAttribute('data-theme', saved.theme);
        }
    } catch (e) {
    }
    var hash = location.hash.replace('#', '').split('&');
    hash.forEach(function (kv) {
        var p = kv.split('=');
        if (p[0] === 'tab') {
            if (LEGACY_TABS[p[1]]) {
                state.tab = 'skills';
                state.view = p[1];
            } else if (MAIN_TABS.indexOf(p[1]) >= 0) {
                state.tab = p[1];
            }
        } else if (p[0] === 'view' && SKILL_VIEWS.indexOf(p[1]) >= 0) {
            state.view = p[1];
        } else if (p[0] === 'f' && ['all', 'both', 'r', '381', 'missing', 'diff'].indexOf(p[1]) >= 0) {
            state.f = p[1];
        } else if (p[0] === 'q') {
            state.q = decodeURIComponent(p[1] || '');
        } else if (p[0] === 'p') {
            state.page = Math.max(0, (parseInt(p[1], 10) || 1) - 1);
        } else if (p[0] === 'map') {
            state.openMap = parseInt(p[1], 10);
        }
    });

    function save() {
        try {
            localStorage.setItem('iconCompareState', JSON.stringify({
                tab: state.tab,
                view: state.view,
                theme: document.documentElement.getAttribute('data-theme') || ''
            }));
        } catch (e) {
        }
    }

    function dataKey() {
        if (state.tab === 'skills') {
            return state.view;
        }
        return state.tab;
    }

    function imgSrc(folder, dir, icon) {
        var prefix = (dir === 'r' || dir === 'R') ? 'R' : '381';
        return 'img/' + folder + '/' + prefix + '-' + icon + '.png';
    }

    // 搜尋只使用圖片編號，不依名稱或資料編號配對。
    function prep(rows) {
        rows.forEach(function (r) {
            [r.a, r.b].forEach(function (s) {
                if (s) {
                    r.t = (r.t || '') + ' ' + s.iconNo + ' ';
                }
            });
        });
    }
    prep(DATA.items);
    prep(DATA.skills);
    // 狀態圖示（以圖號配對）：數字搜尋比對圖號或效果 ID，文字搜尋比對名稱、說明、字串鍵
    (DATA.status || []).forEach(function (r) {
        var t = ' ' + r.n + ' ';
        var n = '';
        [r.a, r.b].forEach(function (s) {
            if (s) {
                s.effects.forEach(function (e) {
                    t += e.id + ' ';
                    n += ' ' + e.name + ' ' + e.msg + ' ' + e.key;
                });
            }
        });
        r.t = t;
        r.n2 = n.toLowerCase();
    });

    var $ = function (id) {
        return document.getElementById(id);
    };
    var esc = function (s) {
        return String(s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
    };

    function isStatusView() {
        return state.tab === 'skills' && state.view === 'status';
    }

    function matches(r, q) {
        if (!q) {
            return true;
        }
        if (/^\d+$/.test(q)) {
            return r.t.indexOf(' ' + q + ' ') >= 0;
        }
        return isStatusView() && r.n2.indexOf(q) >= 0;
    }

    // 狀態圖示一側：圖號 N 的圖，下面列出這一版裡用到圖號 N 的效果（效果 ID、名稱、startMsgName），只是輔助資訊。
    // 圖檔存在就顯示（2026-11-07 放寬）：這一版沒有效果用到但圖檔在時，效果列表為空，只顯示圖與提示。
    function statusSide(s, dir) {
        if (!s) {
            return '<div class="side"><div class="slot empty"></div><div class="meta">這一版的狀態沒用這個圖號</div></div>';
        }
        var img = s.icon
            ? '<div class="slot"><img class="icon-' + dir + '" loading="lazy" decoding="async" width="50" height="50" alt="" src="' + imgSrc('status', dir, s.icon) + '" onerror="this.parentNode.className=\'slot noimg\';this.parentNode.textContent=\'破圖\'"></div>'
            : '<div class="slot noimg">缺圖</div>';
        if (!s.effects.length) {
            return '<div class="side">' + img +
                '<div class="meta">這一版的狀態沒用這個圖號</div></div>';
        }
        var tip = s.effects.map(function (e) {
            return '效果 ' + e.id + '　' + e.name + (e.key ? '　' + e.key : '') + (e.msg && e.msg !== e.name ? '\n　' + e.msg : '');
        }).join('\n');
        var first = s.effects[0];
        var more = s.effects.length > 1 ? '（另 ' + (s.effects.length - 1) + ' 個效果）' : '';
        return '<div class="side" title="' + esc(tip) + '">' + img +
            '<div class="name">' + esc(first.name) + '</div>' +
            '<div class="meta">效果 ' + first.id + (first.key ? '・' + esc(first.key) : '') + esc(more) + '</div></div>';
    }

    function filtered() {
        var q = state.q.trim().toLowerCase();
        var rows = DATA[dataKey()];
        var counts = { all: 0, both: 0, r: 0, '381': 0, missing: 0, diff: 0 };
        var list = [];
        rows.forEach(function (r) {
            if (!matches(r, q)) {
                return;
            }
            counts.all++;
            counts[r.k]++;
            if (r.usage === '異') {
                counts.diff++;
            }
            if (state.f === 'all' || state.f === r.k || (state.f === 'diff' && r.usage === '異')) {
                list.push(r);
            }
        });
        return { list: list, counts: counts };
    }

    function side(s, dir, folder) {
        if (!s) {
            return '<div class="side"><div class="slot empty"></div></div>';
        }
        var img = s.icon
            ? '<div class="slot"><img class="icon-' + dir + '" loading="lazy" decoding="async" width="50" height="50" alt="" src="' + imgSrc(folder, dir, s.icon) + '" onerror="this.parentNode.className=\'slot noimg\';this.parentNode.textContent=\'破圖\'"></div>'
            : '<div class="slot noimg">缺圖</div>';
        var names = s.count ? s.names.join('、') : '未使用';
        var tooltip = s.count ? s.names.join('\n') : '未使用';
        return '<div class="side" title="' + esc(tooltip + '\n圖號 ' + s.iconNo + '・來源引用 ' + s.count + ' 筆') + '">' + img +
            '<div class="name">' + esc(names) + '</div>' +
            '<div class="meta">圖號 ' + s.iconNo + '・來源引用 ' + s.count + ' 筆</div></div>';
    }

    var TAG = { both: ['both', '兩邊有圖'], r: ['r', '只有 R 圖'], '381': ['v381', '只有 381 圖'], missing: ['', '兩邊缺圖'] };
    var STATUS_TAG = { both: ['both', '兩邊都有'], r: ['r', '只有 R'], '381': ['v381', '只有 381'], missing: ['', '兩邊缺圖'] };
    var FILTER_TEXT = {
        normal: { both: '兩邊有圖', r: '只有 R 圖', '381': '只有 381 圖', missing: '兩邊缺圖' },
        status: { both: '兩邊都有', r: '只有 R', '381': '只有 381', missing: '兩邊缺圖' }
    };

    function syncChrome() {
        document.querySelectorAll('#rail button').forEach(function (b) {
            b.setAttribute('aria-pressed', String(b.dataset.tab === state.tab));
        });
        document.querySelectorAll('#skillViews button').forEach(function (b) {
            b.setAttribute('aria-pressed', String(b.dataset.view === state.view));
        });
    }

    function writeHash(extra) {
        var h = 'tab=' + state.tab;
        if (state.tab === 'skills') {
            h += '&view=' + state.view;
        }
        if (extra) {
            h += extra;
        } else if (state.q) {
            h += '&q=' + encodeURIComponent(state.q);
        }
        history.replaceState(null, '', '#' + h);
    }

    function renderEmpty(label) {
        $('filters').hidden = true;
        $('clsSel').hidden = true;
        $('pickBar').hidden = true;
        $('topPager').hidden = true;
        $('skillViews').hidden = true;
        $('q').hidden = true;
        $('grid').className = 'grid';
        if ($('exportOut')) {
            $('exportOut').remove();
        }
        syncChrome();
        $('summary').textContent = '';
        $('legend').innerHTML = '';
        $('grid').innerHTML = '<div class="empty-state">' + esc(label) + '目前尚無資料。</div>';
        writeHash(state.q ? '&q=' + encodeURIComponent(state.q) : '');
    }

    function fillAssetFolders(rows) {
        var sel = $('assetSel');
        var keep = sel.value;
        var seen = {};
        sel.innerHTML = '';
        var all = document.createElement('option');
        all.value = '';
        all.textContent = '全部資料夾';
        sel.appendChild(all);
        rows.forEach(function (r) {
            var f = r.folder || '(根目錄)';
            if (!seen[f]) {
                seen[f] = true;
                var o = document.createElement('option');
                o.value = r.folder || '';
                o.textContent = f;
                sel.appendChild(o);
            }
        });
        if (keep && seen[keep] || keep === '') {
            sel.value = keep;
        }
    }

    function hideIconChrome() {
        $('filters').hidden = true;
        $('clsSel').hidden = true;
        $('pickBar').hidden = true;
        $('skillViews').hidden = true;
        if ($('exportOut')) {
            $('exportOut').remove();
        }
        $('legend').innerHTML = '';
        $('q').hidden = false;
        $('topPager').hidden = false;
        syncChrome();
    }

    function setPager(total) {
        var pages = Math.max(1, Math.ceil(total / PAGE));
        if (state.page >= pages) {
            state.page = pages - 1;
        }
        $('topPager').querySelector('[data-p="prev"]').disabled = state.page === 0;
        $('topPager').querySelector('[data-p="first"]').disabled = state.page === 0;
        $('topPager').querySelector('[data-p="next"]').disabled = state.page >= pages - 1;
        $('topPager').querySelector('[data-p="last"]').disabled = state.page >= pages - 1;
        $('pgin').max = pages;
        $('pgin').value = state.page + 1;
        $('topPages').textContent = pages;
        return pages;
    }

    function renderMaps() {
        hideIconChrome();
        $('assetSel').hidden = true;
        $('q').placeholder = '搜尋地圖編號或名稱';
        var q = state.q.trim().toLowerCase();
        var rows = DATA.maps || [];
        var list = rows.filter(function (r) {
            if (!q) {
                return true;
            }
            var blob = String(r.id) + ' ' + (r.name381 || r.name || '') + ' ' + (r.nameR || '');
            return blob.toLowerCase().indexOf(q) >= 0;
        });
        setPager(list.length);
        var start = state.page * PAGE;
        var slice = list.slice(start, start + PAGE);
        var html = [];
        slice.forEach(function (r) {
            var img = r.file
                ? '<img loading="lazy" decoding="async" alt="" src="img/maps/' + r.file + '" onerror="this.alt=\'破圖\';this.style.opacity=\'.3\'">'
                : '<div class="map-missing">缺圖</div>';
            html.push('<div class="asset-card map-card" data-map="' + r.id + '">' + img +
                '<div class="name">381　' + esc(r.name381 || r.name || '未知') + '</div>' +
                '<div class="name">R　' + esc(r.nameR || '未知') + '</div>' +
                '<div class="meta">地圖 ' + r.id + '</div>' +
                '<div class="meta">X ' + r.startX + '～' + r.endX + '</div>' +
                '<div class="meta">Y ' + r.startY + '～' + r.endY + '</div></div>');
        });
        $('grid').className = 'map-grid';
        $('grid').innerHTML = html.join('') || '<div class="empty-state">沒有符合的地圖。</div>';
        var unknown381 = 0;
        var unknownR = 0;
        rows.forEach(function (r) {
            if ((r.name381 || r.name) === '未知' || r.name381Src === 'unknown' || r.nameSrc === 'unknown') {
                unknown381++;
            }
            if (!r.nameR || r.nameR === '未知' || r.nameRSrc === 'unknown') {
                unknownR++;
            }
        });
        $('summary').textContent = '地圖：點一張可單獨放大（滾輪縮放、拖曳移動）。381 名稱來自 mapnames.txt，沒有再查後端 mapids；R 名稱來自 zone3.xml 同編號的第一個區域，兩邊不一樣就各顯示各的。本頁 ' +
            list.length + ' 張（全部 ' + rows.length + '，381 未知 ' + unknown381 + '，R 未知 ' + unknownR + '）。';
        writeHash('&f=' + state.f + (state.q ? '&q=' + encodeURIComponent(state.q) : '') + '&p=' + (state.page + 1));
    }

    function renderAssets(kind) {
        hideIconChrome();
        var rows = DATA[kind] || [];
        fillAssetFolders(rows);
        $('assetSel').hidden = rows.length === 0;
        $('q').placeholder = '搜尋資料夾或檔名';
        var q = state.q.trim().toLowerCase();
        var folder = $('assetSel').value;
        var list = rows.filter(function (r) {
            if (folder && r.folder !== folder) {
                return false;
            }
            if (!q) {
                return true;
            }
            return (r.file || '').toLowerCase().indexOf(q) >= 0 || (r.name || '').toLowerCase().indexOf(q) >= 0;
        });
        setPager(list.length);
        var start = state.page * PAGE;
        var slice = list.slice(start, start + PAGE);
        var html = [];
        var prefix = kind === 'ui' ? 'img/ui/' : 'img/portraits/';
        slice.forEach(function (r) {
            html.push('<div class="asset-card"><img loading="lazy" decoding="async" alt="" src="' +
                prefix + r.file + '" onerror="this.alt=\'破圖\';this.style.opacity=\'.3\'">' +
                '<div class="name">' + esc(r.name) + '</div>' +
                '<div class="meta">' + esc(r.folder || '') + '</div></div>');
        });
        $('grid').className = 'asset-grid';
        $('grid').innerHTML = html.join('') || '<div class="empty-state">目前尚無資料。</div>';
        var label = kind === 'ui' ? '介面' : '人物立繪';
        var extra = kind === 'ui' && DATA.meta && DATA.meta.uiSkippedFx
            ? '；另略過 Sample／FX_ 特效貼圖 ' + DATA.meta.uiSkippedFx + ' 張'
            : '';
        $('summary').textContent = label + '：R 版 _PakOutput，檔名加 R- 前綴。本頁 ' + list.length + ' 張' + extra + '。';
        writeHash('&f=' + state.f + (state.q ? '&q=' + encodeURIComponent(state.q) : '') + '&p=' + (state.page + 1));
    }

    function render() {
        var isClass = state.tab === 'skills' && state.view === 'classSkills';
        var isAsset = state.tab === 'map' || state.tab === 'ui' || state.tab === 'portraits';
        var isEmpty = !!EMPTY_TABS[state.tab];
        $('skillViews').hidden = state.tab !== 'skills';
        $('q').hidden = isEmpty;
        if (isAsset) {
            if (state.tab === 'map') {
                renderMaps();
            } else {
                renderAssets(state.tab);
            }
            return;
        }
        if (isEmpty) {
            renderEmpty(EMPTY_TABS[state.tab]);
            return;
        }
        $('filters').hidden = isClass;
        $('clsSel').hidden = !isClass;
        $('assetSel').hidden = true;
        $('pickBar').hidden = !isClass;
        $('topPager').hidden = isClass;
        if (isClass) {
            renderClass();
            return;
        }
        $('grid').className = 'grid';
        if ($('exportOut')) {
            $('exportOut').remove();
        }
        syncChrome();
        document.querySelectorAll('#filters button').forEach(function (b) {
            b.setAttribute('aria-pressed', String(b.dataset.f === state.f));
        });
        var isStatus = isStatusView();
        $('filters').querySelector('[data-f="diff"]').hidden = !isStatus;
        if (!isStatus && state.f === 'diff') {
            state.f = 'all';
        }
        var res = filtered();
        var ftext = FILTER_TEXT[isStatus ? 'status' : 'normal'];
        document.querySelectorAll('#filters button').forEach(function (b) {
            if (ftext[b.dataset.f]) {
                b.firstChild.nodeValue = ftext[b.dataset.f];
            }
            b.querySelector('.count').textContent = ' ' + res.counts[b.dataset.f];
        });
        $('q').placeholder = isStatus ? '搜尋圖號、效果編號或名稱' : '搜尋圖片編號';
        var pages = Math.max(1, Math.ceil(res.list.length / PAGE));
        if (state.page >= pages) {
            state.page = pages - 1;
        }
        $('topPager').querySelector('[data-p="prev"]').disabled = state.page === 0;
        $('topPager').querySelector('[data-p="first"]').disabled = state.page === 0;
        $('topPager').querySelector('[data-p="next"]').disabled = state.page >= pages - 1;
        $('topPager').querySelector('[data-p="last"]').disabled = state.page >= pages - 1;
        $('pgin').max = pages;
        $('pgin').value = state.page + 1;
        $('topPages').textContent = pages;
        var start = state.page * PAGE;
        var slice = res.list.slice(start, start + PAGE);
        var html = [];
        var folder = state.tab === 'items' ? 'items' : 'skills';
        slice.forEach(function (r) {
            if (isStatus) {
                var st = STATUS_TAG[r.k];
                html.push('<div class="row"><span class="tag ' + st[0] + '">' + st[1] + '</span>' +
                    '<div class="eid">圖號 ' + r.n + '・對照依據：圖號' + (r.usage === '異' ? '・<span class="diffuse">用途不同</span>' : (r.usage === '同' ? '・用途相同' : '')) + '</div>' +
                    statusSide(r.a, '381') +
                    '<div class="arrow" aria-hidden="true">→</div>' +
                    statusSide(r.b, 'r') + '</div>');
                return;
            }
            var t = TAG[r.k];
            html.push('<div class="row"><span class="tag ' + t[0] + '">' + t[1] + '</span>' +
                side(r.a, '381', folder) +
                '<div class="arrow" aria-hidden="true">→</div>' +
                side(r.b, 'r', folder) + '</div>');
        });
        $('grid').innerHTML = html.join('') || '<div class="summary">沒有符合的資料。</div>';
        var range = '第 ' + (res.list.length ? start + 1 : 0) + '～' + Math.min(start + PAGE, res.list.length);
        if (isStatus) {
            $('summary').textContent = '狀態圖示：依圖號比對（381 狀態圖號 N 對 R 狀態圖號 N；381 側已套用 RStatusIconMap.xml 改號），共 ' + res.list.length + ' 個圖號，' + range +
                ' 個。左邊 381 EffectList2.xml 的圖、右邊 R effectlist2-c.xml 的圖；效果 ID 與用途只是輔助資訊。';
        } else {
            $('summary').textContent = (state.tab === 'items' ? '道具' : '技能') + '：依圖片編號比對，共 ' + res.list.length +
                ' 個圖號，' + range + ' 個。左邊 381、右邊 R。';
        }
        renderLegend();
        writeHash('&f=' + state.f + (state.q ? '&q=' + encodeURIComponent(state.q) : '') + '&p=' + (state.page + 1));
    }

    // ---------- 轉職技能分頁 ----------
    // 選擇記在 localStorage 'iconComparePicks'：{ 技能編號: { skillIcon: 圖號, statusIcon: 圖號 } }
    var picks = {};
    try {
        picks = JSON.parse(localStorage.getItem('iconComparePicks') || '{}') || {};
    } catch (e) {
        picks = {};
    }

    function savePicks() {
        try {
            localStorage.setItem('iconComparePicks', JSON.stringify(picks));
        } catch (e) {
        }
    }

    function setPick(id, kind, icon) {
        var p = picks[id] || {};
        if (icon) {
            p[kind] = icon;
        } else {
            delete p[kind];
        }
        if (p.skillIcon || p.statusIcon) {
            picks[id] = p;
        } else {
            delete picks[id];
        }
        savePicks();
    }

    (function fillClassSelect() {
        var seen = {};
        DATA.classSkills.forEach(function (c) {
            if (!seen[c.cls]) {
                seen[c.cls] = true;
                var o = document.createElement('option');
                o.value = c.cls;
                o.textContent = c.cls;
                $('clsSel').appendChild(o);
            }
        });
    })();

    function slotHtml(folder, dir, icon, emptyText) {
        if (icon) {
            return '<div class="slot"><img class="icon-' + dir + '" loading="lazy" width="50" height="50" alt="" src="' +
                imgSrc(folder, dir, icon) +
                '" onerror="this.parentNode.className=\'slot noimg\';this.parentNode.textContent=\'破圖\'"></div>';
        }
        return '<div class="slot empty">' + (emptyText ? '<span class="meta">' + emptyText + '</span>' : '') + '</div>';
    }

    function candHtml(c, kind, cand) {
        var p = picks[c.id] || {};
        var sel = cand.iconNo && p[kind] === cand.iconNo;
        var idText = kind === 'skillIcon' ? 'R 技能 ' + cand.rid + '（' + cand.cls + '）' : 'R 狀態 ' + cand.eid;
        var folder = kind === 'skillIcon' ? 'skills' : 'status';
        return '<div class="cand' + (sel ? ' sel' : '') + '">' + slotHtml(folder, 'r', cand.icon, cand.icon ? '' : '無圖') +
            '<div class="name">' + esc(cand.name || '（無名稱）') + '</div>' +
            '<div class="meta" title="' + esc(cand.msg || '') + '">' + esc(idText) + '<br>圖 ' + cand.iconNo + '</div>' +
            '<div class="how">' + esc(cand.how) + '</div>' +
            '<button data-pick="' + c.id + '" data-kind="' + kind + '" data-icon="' + cand.iconNo + '">' +
            (sel ? '取消選擇' : '選這張') + '</button></div>';
    }

    function renderClass() {
        syncChrome();
        var q = state.q.trim().toLowerCase();
        var cls = $('clsSel').value;
        var html = [];
        var last = '';
        var shown = 0;
        DATA.classSkills.forEach(function (c) {
            if (cls && c.cls !== cls) {
                return;
            }
            var hay = (c.name + ' ' + c.id + ' ' + c.cls + c.element + ' ' + c.route + ' ' + c.desc).toLowerCase();
            if (q && hay.indexOf(q) < 0) {
                return;
            }
            shown++;
            var head = c.cls + (c.element ? '（' + c.element + '）' : '');
            if (head !== last) {
                html.push('<div class="cls-head">' + esc(head) + '</div>');
                last = head;
            }
            var st = c.status381;
            var stIcon = st.icon && !st.missing ? st.icon : 0;
            var stNote = st.icon ? (st.missing ? '狀態圖 ' + st.icon + '：pak 裡沒有圖' : '狀態圖 ' + st.icon) :
                (st.graphic ? 'castgfx ' + st.graphic + ' 不在 effectlist2' : '沒有 castgfx');
            var p = picks[c.id] || {};
            var left = '<div class="cls-left"><div class="icons">' +
                '<div>' + slotHtml('skills', '381', 0, '') + '<div class="lbl">381 技能圖<br>無</div></div>' +
                '<div>' + slotHtml('status', '381', stIcon, '') + '<div class="lbl">381 狀態圖<br>' + esc(stNote) + '</div></div>' +
                '</div><div class="title">' + esc(c.name) + '</div>' +
                '<div class="meta">技能 ' + c.id + '・' + esc(head) + '・' + c.stage + ' 轉 ' + esc(c.route) + '</div>' +
                '<div class="desc">' + esc(c.desc) + '</div>' +
                '<div class="manual">自填技能圖號 <input type="number" min="0" data-manual="' + c.id + '" data-kind="skillIcon" value="' + (p.skillIcon || '') + '">' +
                ' 狀態圖號 <input type="number" min="0" data-manual="' + c.id + '" data-kind="statusIcon" value="' + (p.statusIcon || '') + '"></div>' +
                '</div>';
            var sk = c.skillC.length ? c.skillC.map(function (x) {
                return candHtml(c, 'skillIcon', x);
            }).join('') : '<div class="none">無候選</div>';
            var ss = c.statusC.length ? c.statusC.map(function (x) {
                return candHtml(c, 'statusIcon', x);
            }).join('') : '<div class="none">無候選</div>';
            html.push('<div class="cls-row">' + left + '<div>' +
                '<div class="cand-group"><div class="gt">R 技能圖候選（' + c.skillC.length + '）</div><div class="cands">' + sk + '</div></div>' +
                '<div class="cand-group"><div class="gt">R 狀態圖候選（' + c.statusC.length + '）</div><div class="cands">' + ss + '</div></div>' +
                '</div></div>');
        });
        $('grid').className = 'cls-list';
        $('grid').innerHTML = html.join('') || '<div class="summary">沒有符合的資料。</div>';
        $('summary').textContent = '轉職技能：' + shown + ' 個（共 ' + DATA.classSkills.length +
            '）。左邊 381 現況，右邊 R 候選圖；按「選這張」記住選擇，最後按「匯出選擇」。';
        $('legend').innerHTML = legendNormal;
        $('pickCount').textContent = '已選 ' + Object.keys(picks).length + ' 個技能';
        writeHash(state.q ? '&q=' + encodeURIComponent(state.q) : '');
    }

    function exportPicks() {
        var list = [];
        DATA.classSkills.forEach(function (c) {
            var p = picks[c.id];
            if (p) {
                list.push({
                    skillId: c.id,
                    name: c.name,
                    cls: c.cls + (c.element ? '(' + c.element + ')' : ''),
                    route: c.route,
                    skillIcon: p.skillIcon || 0,
                    statusIcon: p.statusIcon || 0
                });
            }
        });
        var text = JSON.stringify({ source: 'R icon.idx <圖號>.png', exported: new Date().toISOString(), picks: list }, null, 2);
        var box = $('exportOut');
        if (!box) {
            box = document.createElement('textarea');
            box.id = 'exportOut';
            box.readOnly = true;
            $('summary').after(box);
        }
        box.value = text;
        try {
            var a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
            a.download = 'class-skill-icon-picks.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
        } catch (e) {
        }
    }

    var mapZoom = 1;
    var mapPanX = 0;
    var mapPanY = 0;
    var mapDrag = null;

    function mapById(id) {
        var rows = DATA.maps || [];
        for (var i = 0; i < rows.length; i++) {
            if (rows[i].id === id) {
                return rows[i];
            }
        }
        return null;
    }

    function applyMapTransform() {
        var img = $('mapViewImg');
        img.style.transform = 'translate(calc(-50% + ' + mapPanX + 'px), calc(-50% + ' + mapPanY + 'px)) scale(' + mapZoom + ')';
    }

    function openMap(r) {
        if (!r) {
            return;
        }
        mapZoom = 1;
        mapPanX = 0;
        mapPanY = 0;
        var img = $('mapViewImg');
        img.src = r.file ? 'img/maps/' + r.file : '';
        img.alt = (r.name381 || r.name || '') + ' / ' + (r.nameR || '');
        $('mapViewTitle').innerHTML = '<div class="name">地圖 ' + r.id + '</div>' +
            '<div class="meta">381　' + esc(r.name381 || r.name || '未知') + '</div>' +
            '<div class="meta">R　' + esc(r.nameR || '未知') + '</div>' +
            '<div class="meta">X ' + r.startX + '～' + r.endX + '　Y ' + r.startY + '～' + r.endY + '</div>';
        $('mapView').hidden = false;
        applyMapTransform();
    }

    function closeMap() {
        $('mapView').hidden = true;
        $('mapViewImg').removeAttribute('src');
    }

    $('mapViewClose').addEventListener('click', closeMap);
    $('mapView').addEventListener('click', function (e) {
        var zoom = e.target.closest('button[data-zoom]');
        if (!zoom) {
            return;
        }
        if (zoom.dataset.zoom === 'in') {
            mapZoom = Math.min(8, mapZoom * 1.25);
        } else if (zoom.dataset.zoom === 'out') {
            mapZoom = Math.max(0.4, mapZoom / 1.25);
        } else {
            mapZoom = 1;
            mapPanX = 0;
            mapPanY = 0;
        }
        applyMapTransform();
    });
    $('mapViewStage').addEventListener('wheel', function (e) {
        if ($('mapView').hidden) {
            return;
        }
        e.preventDefault();
        var next = e.deltaY < 0 ? mapZoom * 1.12 : mapZoom / 1.12;
        mapZoom = Math.max(0.4, Math.min(8, next));
        applyMapTransform();
    }, { passive: false });
    $('mapViewStage').addEventListener('pointerdown', function (e) {
        if (e.button !== 0) {
            return;
        }
        mapDrag = { x: e.clientX, y: e.clientY, px: mapPanX, py: mapPanY };
        $('mapViewStage').classList.add('is-drag');
        $('mapViewStage').setPointerCapture(e.pointerId);
    });
    $('mapViewStage').addEventListener('pointermove', function (e) {
        if (!mapDrag) {
            return;
        }
        mapPanX = mapDrag.px + (e.clientX - mapDrag.x);
        mapPanY = mapDrag.py + (e.clientY - mapDrag.y);
        applyMapTransform();
    });
    function endMapDrag() {
        mapDrag = null;
        $('mapViewStage').classList.remove('is-drag');
    }
    $('mapViewStage').addEventListener('pointerup', endMapDrag);
    $('mapViewStage').addEventListener('pointercancel', endMapDrag);
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !$('mapView').hidden) {
            closeMap();
        }
    });

    $('grid').addEventListener('click', function (e) {
        var card = e.target.closest('.map-card');
        if (card && state.tab === 'map') {
            openMap(mapById(parseInt(card.dataset.map, 10)));
            return;
        }
        var b = e.target.closest('button[data-pick]');
        if (!b) {
            return;
        }
        var id = b.dataset.pick;
        var kind = b.dataset.kind;
        var icon = parseInt(b.dataset.icon, 10);
        var cur = (picks[id] || {})[kind];
        setPick(id, kind, cur === icon ? 0 : icon);
        renderClass();
    });
    $('grid').addEventListener('change', function (e) {
        var t = e.target;
        if (t.dataset && t.dataset.manual) {
            setPick(t.dataset.manual, t.dataset.kind, parseInt(t.value, 10) || 0);
            renderClass();
        }
    });
    $('clsSel').addEventListener('change', function () {
        renderClass();
    });
    $('assetSel').addEventListener('change', function () {
        state.page = 0;
        update(true);
    });
    $('exportBtn').addEventListener('click', exportPicks);
    $('clearBtn').addEventListener('click', function () {
        if (confirm('清除全部選擇？')) {
            picks = {};
            savePicks();
            renderClass();
        }
    });

    function update(scroll) {
        render();
        save();
        if (scroll) {
            window.scrollTo(0, 0);
        }
    }

    $('rail').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (b) {
            state.tab = b.dataset.tab;
            state.page = 0;
            update(true);
        }
    });
    $('skillViews').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (b) {
            state.view = b.dataset.view;
            state.page = 0;
            update(true);
        }
    });
    $('filters').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (b) {
            state.f = b.dataset.f;
            state.page = 0;
            update(true);
        }
    });
    function changePage(e) {
        var b = e.target.closest('button');
        if (!b || b.disabled) {
            return;
        }
        var p = b.dataset.p;
        if (p === 'first') {
            state.page = 0;
        } else if (p === 'prev') {
            state.page--;
        } else if (p === 'next') {
            state.page++;
        } else if (p === 'last') {
            state.page = 1e9;
        }
        update(true);
    }
    $('topPager').addEventListener('click', changePage);
    $('pgin').addEventListener('change', function () {
        var pages = parseInt(this.max, 10);
        state.page = Math.max(0, Math.min(pages - 1, (parseInt(this.value, 10) || 1) - 1));
        update(true);
    });
    var timer = 0;
    $('q').value = state.q;
    $('q').addEventListener('input', function () {
        clearTimeout(timer);
        var v = this.value;
        timer = setTimeout(function () {
            state.q = v;
            state.page = 0;
            update(false);
        }, 150);
    });
    $('theme').addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme');
        var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
        save();
    });

    var m = DATA.meta;
    var legendNormal =
        '配對規則：只依圖片編號完全相同配對，不使用名稱或道具／技能資料編號；名稱只是顯示（過長會省略，滑鼠移到該圖上可看完整名稱）。<br>' +
        '381 道具 ' + m.raw.items381 + ' 筆（' + esc(m.src381Items) + '）；381 技能 ' + m.raw.skills381 + ' 筆（' + esc(m.src381Skills) + '）；' +
        'R 道具 ' + m.raw.itemsR + ' 筆、R 技能 ' + m.raw.skillsR + ' 筆（' + esc(m.srcR) + '）。<br>' +
        '篩選依實際圖檔分類。「未使用」＝該版本的此類道具或技能資料未引用此圖號，不代表其他用途未使用；「缺圖」＝找不到該版本的圖片檔。';
    var sm = DATA.statusMeta || {};
    var legendStatus =
        '配對規則：<b>以圖號為主</b>（使用者 2026-11-06 改定）——381 EffectList2.xml 的狀態圖號 N（Sprite 的 N.tbt）和 R effectlist2-c.xml 的狀態圖號 N（icon.idx 的 N.png）放同一列；' +
        '使用者觀察兩邊大部分是同一張圖的新舊版，效果 ID／用途因改版常對不上，所以只當輔助：每側列出這一版用到這個圖號的效果（滑鼠移到圖上看全部）。' +
        '兩邊都用到這個圖號時，有任何一個效果兩邊 startMsgName 相同標「用途相同」，否則標「用途不同」（不拆列）。圖案是否真的相同請以畫面判斷（形狀比對另有頁面）。<br>' +
        '381：' + esc(sm.src381 || '') + '，效果 ' + (sm.effects381 || 0) + ' 筆、用到 ' + (sm.icons381 || 0) + ' 個圖號；' +
        'R：' + esc(sm.srcR || '') + '，效果 ' + (sm.effectsR || 0) + ' 筆、用到 ' + (sm.iconsR || 0) + ' 個圖號。<br>' +
        '兩邊都有 ' + (sm.bothIcons || 0) + ' 個圖號（用途相同 ' + (sm.usageSame || 0) + '、用途不同 ' + (sm.usageDiff || 0) + '）；只有 381 ' + (sm.only381 || 0) + '、只有 R ' + (sm.onlyR || 0) + '。「兩邊缺圖」＝兩邊都找不到圖檔。';

    function renderLegend() {
        $('legend').innerHTML = isStatusView() ? legendStatus : legendNormal;
    }

    render();
    if (state.openMap || state.openMap === 0) {
        openMap(mapById(state.openMap));
    }
})();
</script>
</body>
</html>
